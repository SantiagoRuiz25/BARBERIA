name: Deploy Angular to GitHub Pages

on:
  push:
    branches:
      - release

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: BARBERIA/package-lock.json

      - name: Install dependencies
        run: npm install
        working-directory: ./BARBERIA

      - name: Build Angular app
        run: npx ng build --base-href "/BARBERIA/"
        working-directory: ./BARBERIA

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: BARBERIA/dist/barberia/browser
          branch: gh-pages
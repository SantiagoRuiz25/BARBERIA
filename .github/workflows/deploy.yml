name: Deploy Angular to GitHub Pages

on:
  push:
    branches:
      - release  # Se ejecutará automáticamente cuando hagas push o merge a la rama release

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Angular app
        run: npx ng build --base-href "/BARBERIA/"

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist/barberia/browser  # Revisa el nombre exacto de la carpeta en dist si varía
          branch: gh-pages

          